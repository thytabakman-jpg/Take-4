name: Take-4 IC28 Corpus Ingestion
on:
  push:
    paths:
      - 'experiments/010-ic28-corpus/**'
      - '.github/workflows/ic28-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Take-4
        uses: actions/checkout@v4
      - name: Checkout private Reaserch corpus
        uses: actions/checkout@v4
        with:
          repository: thytabakman-jpg/Reaserch
          token: ${{ secrets.REASERCH_READ_TOKEN }}
          path: _reaserch
          persist-credentials: false
          fetch-depth: 1
      - name: Ingest IC26 lineage maps math and tools with no substantive job
        env:
          REASERCH_DIR: ${{ github.workspace }}/_reaserch
        run: python3 experiments/010-ic28-corpus/ingest.py
      - name: Run Take-4 closed-loop witness
        run: python3 experiments/004-closed-loop/loop.py
      - name: Kernel fitness
        run: python3 tools/check_kernel.py
      - name: Upload corpus result
        uses: actions/upload-artifact@v4
        with:
          name: take4-ic28-corpus-result
          path: experiments/010-ic28-corpus/result.json
