name: EWG reference checks

on:
  push:
    branches:
      - ic/endogenous-work-generator-v1
  pull_request:
  workflow_dispatch:

jobs:
  ewg-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_ewg.py
