name: Take-4 Map Ingestion
on:
  push:
    paths:
      - 'experiments/009-map-ingestion/**'
      - '.github/workflows/map-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Take-4
        uses: actions/checkout@v4
      - name: Checkout private Reaserch corpus
        uses: actions/checkout@v4
        with:
          repository: thytabakman-jpg/Reaserch
          token: ${{ secrets.REASERCH_READ_TOKEN }}
          path: _reaserch
          persist-credentials: false
          fetch-depth: 1
      - name: Ingest every current map from Reaserch
        env:
          REASERCH_DIR: ${{ github.workspace }}/_reaserch
        run: python3 experiments/009-map-ingestion/ingest.py
      - name: Run Take-4 closed-loop witness
        run: python3 experiments/004-closed-loop/loop.py
      - name: Kernel fitness
        run: python3 tools/check_kernel.py
      - name: Upload ingestion result
        uses: actions/upload-artifact@v4
        with:
          name: take4-map-ingestion-result
          path: experiments/009-map-ingestion/result.json
